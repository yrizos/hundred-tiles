repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vitest-unit
        name: vitest (unit)
        entry: npx vitest run src/game
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: vitest-component
        name: vitest (component)
        entry: npx vitest run src/App.test.tsx src/components
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: tsc
        name: tsc
        entry: npx tsc -b
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: oxlint
        name: oxlint
        entry: npx oxlint
        language: system
        pass_filenames: false
        stages: [pre-commit]
